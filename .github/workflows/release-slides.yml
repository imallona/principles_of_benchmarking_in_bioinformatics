name: Build LaTeX slides

on:
  pull_request:
    paths:
      - '*/slides/*.tex'
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to delete/create releases and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Compile 01-basics slides
      - name: Compile 01-basics slides
        uses: xu-cheng/latex-action@v3
        with:
          root_file: basics.tex
          working_directory: 01-basics/slides
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Check if 01-basics PDF was created
        run: |
          test -f 01-basics/slides/basics.pdf

      # Compile 06-omnibenchmark slides
      - name: Compile 06-omnibenchmark slides
        uses: xu-cheng/latex-action@v3
        with:
          root_file: omnibenchmark.tex
          working_directory: 06-omnibenchmark/slides
          args: -pdf -interaction=nonstopmode -file-line-error

      - name: Check if 06-omnibenchmark PDF was created
        run: |
          test -f 06-omnibenchmark/slides/omnibenchmark.pdf

      # Delete existing 'latest' release and tag as latest
      - name: Delete existing 'latest' release and tag
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create new 'latest' release
      - name: Create or update 'latest' release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Source code
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload all PDFs to release
      - name: Upload PDFs to release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: 01-basics/slides/basics.pdf 06-omnibenchmark/slides/omnibenchmark.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
